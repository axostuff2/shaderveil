name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already has the Android SDK (ANDROID_HOME); no setup-android step needed.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download depth model (MiDaS small, MIT licence)
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 -o app/src/main/assets/models/midas_small.tflite \
            https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite \
            || echo "model download failed; the app will run without neural depth"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ShaderVeil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
